<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Familienküche"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Familienküche</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26352c;background:#f8f7f2;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer} .app{max-width:750px;margin:auto;min-height:100dvh;padding:0 16px 100px}.top{position:sticky;top:0;z-index:4;background:#f8f7f2ef;backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 18px) 0 15px;border-bottom:1px solid #e5e7e1}.eyebrow{color:#758176;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.top h1{margin:2px 0 0;font-size:27px;letter-spacing:-.8px}.top p{margin:5px 0 0;color:#728076;font-size:13px}.nav{position:fixed;z-index:7;bottom:0;left:0;right:0;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) ;background:#fffefaee;border-top:1px solid #e8ebe4;display:flex;justify-content:center;gap:5px;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#7b857c;min-width:0;flex:1;max-width:160px;border-radius:13px;display:grid;justify-items:center;gap:4px;padding:8px 3px;font-size:11px;font-weight:600}.nav button.active{color:#356449;background:#e8f0e8}.nav svg{width:22px;height:22px}.section{margin-top:23px}.sectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 12px}.sectionTitle h2{font-size:20px;letter-spacing:-.4px;margin:0}.muted{color:#7c857d}.small{font-size:13px}.card{background:#fff;box-shadow:0 3px 14px #28382d08;border:1px solid #ecefe8;border-radius:19px;padding:16px;margin:10px 0}.hero{background:#e7eee4;border-radius:21px;padding:20px;margin:18px 0 5px}.hero h2{margin:4px 0;font-size:21px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.btn{border:0;border-radius:12px;background:#336749;color:white;font-weight:650;padding:12px 15px;display:inline-flex;gap:8px;justify-content:center;align-items:center}.btn.secondary{background:# px;height:30px;color:#3e694e}.counter input{width:70px;padding:7px;text-align:center}.switches{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.switches .btn{white-space:nowrap}.empty{padding:24px 12px;text-align:center;color:#7d8b7e}.modalback{position:fixed;z-index:15;inset:0;background:#1a251b99;display:flex;align-items:flex-end;justify-content:center}.modal{background:#fcfcf8;width:100%;max-width:750px;max-height:90dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 10px}.mutedbox{background:#eff3ea;border-radius:12px;padding:12px;font-size:13px;color:#58705c}.divider{border:0;border-top:1px solid #e8ece6;margin:17px 0}.bar{height:8px;background:#dae4d7;border-radius:20px;overflow:hidden;margin-top:13px}.bar div{height:100%;background:#518666}.inline-select{width:auto;padding:8px;font-size:13px}.hidden{display:none!important}.notice{font-size:12px;color:#7b867b;line-height:1.5}.center{text-align:center}.count{font-weight:750;color:#477451} .suggest{border:1px solid #e3e9dd;border-radius:12px;margin:7px 0;padding:11px;background:white} .suggest strong{display:block;margin-bottom:3px}
.season-list{display:flex;flex-wrap:wrap;gap:8px}.season-item{margin:0;border:1px solid #dce4db;border-radius:10px;padding:9px 10px;background:#fff;display:flex;align-items:center;gap:6px}.season-item input{width:auto}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #336749;outline-offset:2px}.filterbox{background:#fff;border:1px solid #e6ede4;border-radius:13px;padding:11px;margin-top:12px}.filterchips{display:flex;flex-wrap:wrap;gap:7px}.filterchip{border:1px solid #d6e3d5;border-radius:18px;background:#f8faf6;color:#46604e;font-size:12px;font-weight:600;padding:8px 10px}.filterchip.selected{background:#326b49;color:white;border-color:#326b49}.shop-entry{border-bottom:1px solid #edf0e8;padding:5px 0 9px}.shop-entry:last-child{border-bottom:0}.shop-bought{opacity:.65}.shop-bought strong{text-decoration:line-through}.shop-origin{display:block;font-size:11px;color:#89958a;margin-top:3px}.shop-actions{margin-left:32px;gap:4px;flex-wrap:wrap}.shop-actions .btn{padding:7px 9px}.shop-entry .itemrow{border:0}</style></head><body><div id="app" class="app"></div><div id="modal-root"></div><script>
const KEY='familienkueche_v1';const baseGroups=['Reis','Nudeln','Kartoffeln','Hülsenfrüchte','Gemüse','Brot & Teig','Sonstiges'];const seasons=['Frühling','Sommer','Herbst','Winter'];const categories=['Obst & Gemüse','Kühlregal','Backwaren','Vorrat','Tiefkühl','Drogerie','Sonstiges'];const units=['Stück','g','kg','ml','l','Packung','Becher','Bund','Dose','Flasche'];
const demo={dishes:[{id:'d1',name:'Gemüselasagne',group:'Nudeln',seasons:[],emoji:'🍝',minutes:50,category:'Hauptgericht',favorite:true,ingredients:[{name:'Zucchini',qty:2,unit:'Stück'},{name:'Karotten',qty:3,unit:'Stück'},{name:'Passierte Tomaten',qty:500,unit:'g'},{name:'Lasagneplatten',qty:250,unit:'g'},{name:'Käse',qty:200,unit:'g'}],recipe:'Gemüse klein schneiden und anbraten. Mit Tomaten köcheln lassen. Mit Lasagneplatten schichten, Käse darübergeben und im Ofen backen.'},{id:'d2',name:'Kartoffelpuffer',group:'Kartoffeln',seasons:[],emoji:'🥔',minutes:35,category:'Hauptgericht',favorite:true,ingredients:[{name:'Kartoffeln',qty:1000,unit:'g'},{name:'Eier',qty:2,unit:'Stück'},{name:'Mehl',qty:60,unit:'g'}],recipe:'Kartoffeln reiben und ausdrücken. Mit Ei und Mehl vermischen. Portionsweise in wenig Öl knusprig ausbacken.'},{id:'d3',name:'Gemüsecurry',group:'Reis',seasons:[],emoji:'🍛',minutes:30,category:'Hauptgericht',favorite:false,ingredients:[{name:'Reis',qty:250,unit:'g'},{name:'Paprika',qty:2,unit:'Stück'},{name:'Zucchini',qty:1,unit:'Stück'},{name:'Kokosmilch',qty:400,unit:'ml'}],recipe:'Reis garen. Gemüse anbraten, Kokosmilch zugeben und abschmecken.'},{id:'d4',name:'Spaghetti mit Tomatensoße',group:'Nudeln',seasons:[],emoji:'🍅',minutes:20,category:'Hauptgericht',favorite:true,ingredients:[{name:'Spaghetti',qty:500,unit:'g'},{name:'Passierte Tomaten',qty:500,unit:'g'},{name:'Zwiebeln',qty:1,unit:'Stück'}],recipe:'Spaghetti kochen. Zwiebeln anschwitzen, Tomaten zugeben, abschmecken und mit den Nudeln servieren.'}],plan:[{id:'p1',dishId:'d1',done:false},{id:'p2',dishId:'d2',done:false},{id:'p3',dishId:'d3',done:false}],templates:[{id:'t1',name:'Milch',qty:2,unit:'l',category:'Kühlregal'},{id:'t2',name:'Haferflocken',qty:500,unit:'g',category:'Vorrat'},{id:'t3',name:'Bananen',qty:6,unit:'Stück',category:'Obst & Gemüse'},{id:'t4',name:'Eier',qty:10,unit:'Stück',category:'Kühlregal'},{id:'t5',name:'Brot',qty:1,unit:'Stück',category:'Backwaren'}],weekly:null,manual:[],checked:[],history:[],pantry:[],shopOverrides:{},shopExcluded:[]};
const clone=x=>JSON.parse(JSON.stringify(x));let state;try{state=JSON.parse(localStorage.getItem(KEY))||clone(demo)}catch{state=clone(demo)};for(const k in demo)if(!(k in state))state[k]=clone(demo[k]);if(!Array.isArray(state.pantry))state.pantry=[];if(!state.shopOverrides||typeof state.shopOverrides!=='object')state.shopOverrides={};if(!Array.isArray(state.shopExcluded))state.shopExcluded=[];let view='plan',modal=null,query='',filter='Alle',shopTab='list',shopQuery='',shopShowDone=false,weeklyQuery='',searchIngredients='',pickGroups=[],pickSeasons=[],dishGroupsFilter=[],dishSeasonsFilter=[],pickSearch='',pickFav=false;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Speichern fehlgeschlagen. Bitte freien Speicherplatz prüfen.')}};const dish=id=>state.dishes.find(d=>d.id===id);function dishGroup(d){if(d.group)return d.group;const text=nameKey(d.name+' '+(d.ingredients||[]).map(i=>i.name).join(' '));if(/reis|risotto/.test(text))return 'Reis';if(/nudel|spaghetti|lasagne|pasta|penne|fusilli/.test(text))return 'Nudeln';if(/kartoff/.test(text))return 'Kartoffeln';if(/linsen|bohnen|kichererbs/.test(text))return 'Hülsenfrüchte';if(/pizza|brot|wrap|pfannkuchen/.test(text))return 'Brot & Teig';return 'Gemüse'}const dishGroups=d=>Array.isArray(d.groups)&&d.groups.length?d.groups:[dishGroup(d)];const matchesOptions=(d,groups,ss)=> (!groups.length||groups.some(g=>dishGroups(d).includes(g)))&&(!ss.length||ss.some(v=>(d.seasons||[]).includes(v)));const multiFilters=(groups,ss,kind)=>`<div class="filterbox"><div class="small muted" style="margin:7px 0">Grundzutaten · mehrere wählbar</div><div class="filterchips">${baseGroups.map(x=>`<button type="button" class="filterchip ${groups.includes(x)?'selected':''}" onclick="toggleMulti('${kind}','group','${x}')">${groups.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><div class="small muted" style="margin:12px 0 7px">Saison · mehrere wählbar</div><div class="filterchips">${seasons.map(x=>`<button type="button" class="filterchip ${ss.includes(x)?'selected':''}" onclick="toggleMulti('${kind}','season','${x}')">${ss.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><button type="button" class="btn tiny ghost" style="margin-top:8px" onclick="clearMulti('${kind}')">Filter zurücksetzen</button></div>`;function toggleMulti(kind,type,value){const arr=kind==='picker'?(type==='group'?pickGroups:pickSeasons):(type==='group'?dishGroupsFilter:dishSeasonsFilter);if(arr.includes(value))arr.splice(arr.indexOf(value),1);else arr.push(value);if(kind==='picker')openPicker();else draw()}function clearMulti(kind){if(kind==='picker'){pickGroups=[];pickSeasons=[];openPicker()}else{dishGroupsFilter=[];dishSeasonsFilter=[];draw()}};const quantity=i=>`${i.qty} ${i.unit}`;const nameKey=s=>s.trim().toLocaleLowerCase('de').replace(/\s+/g,' ');const ico=(name)=>({plan:'▦',dishes:'♧',shop:'▤',fridge:'▣',settings:'⚙'}[name]);
function ensureWeekly(){if(state.weekly===null)state.weekly=state.templates.map(x=>({...clone(x),source:'standard',templateId:x.id,enabled:true}));}function totals(){const raw=[];state.plan.filter(p=>!p.done).forEach(p=>{const d=dish(p.dishId);if(d)d.ingredients.forEach(x=>raw.push({...x,source:'Gericht',category:guessCategory(x.name)}))});ensureWeekly();state.weekly.filter(x=>x.enabled).forEach(x=>raw.push({...x,source:'Standardprodukt'}));state.manual.forEach(x=>raw.push({...x,source:'Zusatz'}));const aggregated=[];for(const x of raw){let qty=Number(x.qty)||0,unit=x.unit;if(unit==='kg'){unit='g';qty*=1000}if(unit==='l'){unit='ml';qty*=1000}const key=nameKey(x.name)+'|'+unit;let existing=aggregated.find(y=>y.key===key);if(existing){existing.qty+=qty;existing.sources.push(x.source)}else aggregated.push({...x,key,qty,unit,sources:[x.source]})}return aggregated.filter(x=>!state.shopExcluded.includes(x.key)).map(x=>({...x,qty:state.shopOverrides[x.key]!==undefined?Math.max(0,Number(state.shopOverrides[x.key])||0):x.qty})).sort((a,b)=>categories.indexOf(a.category)-categories.indexOf(b.category)||a.name.localeCompare(b.name,'de')).map(x=>({...x,displayQty:x.unit==='g'&&x.qty>=1000?`${(x.qty/1000).toLocaleString('de-DE')} kg`:x.unit==='ml'&&x.qty>=1000?`${(x.qty/1000).toLocaleString('de-DE')} l`:quantity(x)}))}
function guessCategory(n){const s=nameKey(n);if(/milch|käse|joghurt|eier|quark|butter/.test(s))return 'Kühlregal';if(/tomat|paprika|zucchini|kartoff|banan|karott|zwiebel|apfel/.test(s))return 'Obst & Gemüse';if(/brot|brötchen/.test(s))return 'Backwaren';return 'Vorrat'}
function draw(){let sub={plan:'Flexibel planen · ohne feste Wochentage',dishes:'Eure Lieblingsgerichte an einem Ort',shop:'Automatisch und individuell zusammengestellt',fridge:'Ideen mit euren vorhandenen Zutaten',settings:'Daten & Einstellungen'};document.getElementById('app').innerHTML=`<header class="top"><div class="eyebrow">Gemeinsam genießen</div><h1>Familienküche 🍃</h1><p>${sub[view]}</p></header><main>${view==='plan'?drawPlan():view==='dishes'?drawDishes():view==='shop'?drawShop():view==='fridge'?drawFridge():drawSettings()}</main><nav class="nav">${[['plan','Wochenplan'],['dishes','Gerichte'],['shop','Einkauf'],['fridge','Kühlschrank'],['settings','Mehr']].map(([v,l])=>`<button class="${view===v?'active':''}" onclick="navigate('${v}')"><span style="font-size:22px">${ico(v)}</span>${l}</button>`).join('')}</nav>`;document.getElementById('modal-root').innerHTML=modal||'';}
function navigate(v){view=v;modal=null;query='';draw();window.scrollTo(0,0)}function drawPlan(){let active=state.plan.filter(x=>!x.done),done=state.plan.filter(x=>x.done);return `<div class="hero"><div class="eyebrow">Euer Speiseplan</div><h2>Was kochen wir diese Woche?</h2><div class="small muted">${active.length} Gerichte offen · ${done.length} gekocht</div><div class="bar"><div style="width:${state.plan.length?done.length/state.plan.length*100:0}%"></div></div></div><section class="section"><div class="sectionTitle"><h2>Noch geplant</h2><button class="btn tiny" onclick="openPicker()">＋ Gericht</button></div>${active.length?active.map(p=>planCard(p)).join(''):'<div class="card empty">Noch keine Gerichte geplant. Wähle ein Gericht aus eurer Sammlung.</div>'}</section>${done.length?`<section class="section"><div class="sectionTitle"><h2>Bereits gekocht</h2><span class="chip">${done.length} erledigt</span></div>${done.map(p=>planCard(p)).join('')}</section>`:''}<section class="section"><div class="card"><h3 style="margin:0 0 6px">Nächste Woche vorbereiten</h3><p class="muted small">Nicht gekochte Gerichte behalten und bereits gekochte aus dem Plan entfernen. Die Einkaufsliste bleibt unabhängig bearbeitbar.</p><button class="btn secondary" onclick="newWeek()">Neue Woche beginnen →</button></div></section>`}
function planCard(p){const d=dish(p.dishId);if(!d)return '';return `<article class="card ${p.done?'done':''}"><div class="row between"><div class="grow"><div class="meal-title">${safe(d.emoji||'🍽️')} ${safe(d.name)}</div><div class="muted small">${d.minutes||'?'} Minuten · ${d.ingredients.length} Zutaten</div></div><button class="btn tiny ${p.done?'secondary':''}" onclick="toggleCook('${p.id}')">${p.done?'↶ Zurück':'✓ Gekocht'}</button></div><div class="actions"><button class="btn tiny outline" onclick="openDish('${d.id}')">Gericht ansehen</button><button class="btn tiny ghost" onclick="removePlan('${p.id}')">Entfernen</button></div></article>`}
function selectedDishes(){return state.dishes.filter(d=>(filter==='Alle'||(filter==='Favoriten'?d.favorite:d.category===filter))&&nameKey(d.name).includes(nameKey(query))&&matchesOptions(d,dishGroupsFilter,dishSeasonsFilter))}
function drawDishes(){const filtered=selectedDishes();return `<section class="section"><div class="sectionTitle"><h2>Eure Gerichte <span class="muted">(${filtered.length}/${state.dishes.length})</span></h2><button class="btn tiny" onclick="editDish()">＋ Neues Gericht</button></div><input class="search" placeholder="Gericht suchen …" value="${safe(query)}" oninput="query=this.value;refreshDishes()"><div class="switches" style="margin-top:10px">${['Alle','Favoriten','Hauptgericht','Frühstück','Snack','Sonstiges'].map(x=>`<button class="btn tiny ${filter===x?'':'outline'}" onclick="filter=${JSON.stringify(x).replace(/"/g,'&quot;')};draw()">${x}</button>`).join('')}</div>${multiFilters(dishGroupsFilter,dishSeasonsFilter,'dishes')}<div id="dish-results">${dishTiles(filtered)}</div></section>`}
function dishTiles(items){return items.length?`<div class="grid" style="margin-top:12px">${items.map(d=>`<div class="card dish" onclick="openDish('${d.id}')"><div class="art">${safe(d.emoji||'🍽️')}</div><div class="content"><h3>${safe(d.name)} ${d.favorite?'♥':''}</h3><p>${d.minutes||'?'} Min. · ${dishGroups(d).map(safe).join(', ')}</p></div></div>`).join('')}</div>`:'<div class="card empty">Kein Gericht gefunden. Ändere die Filter.</div>'}
function refreshDishes(){document.getElementById('dish-results').innerHTML=dishTiles(selectedDishes())}
function shopEntries(items){return items.map(x=>`<div class="shop-entry ${state.checked.includes(x.key)?'shop-bought':''}"><label class="itemrow" style="margin:0;color:inherit;font-weight:normal"><input type="checkbox" class="tick" ${state.checked.includes(x.key)?'checked':''} onchange="toggleCheck('${encodeURIComponent(x.key)}')"><span class="grow"><strong>${safe(x.name)}</strong><span class="shop-origin">${safe([...new Set(x.sources)].join(' + '))}</span></span><span class="quantity">${safe(x.displayQty)}</span></label><div class="row shop-actions"><button class="btn tiny outline" onclick="adjustShopAmount('${encodeURIComponent(x.key)}',-1)">−</button><button class="btn tiny outline" onclick="editShopAmount('${encodeURIComponent(x.key)}')">Menge ändern</button><button class="btn tiny outline" onclick="adjustShopAmount('${encodeURIComponent(x.key)}',1)">＋</button><button class="btn tiny ghost" onclick="excludeShopItem('${encodeURIComponent(x.key)}')">Entfernen</button></div></div>`).join('')}
function drawShop(){ensureWeekly();const list=totals();const open=list.filter(x=>!state.checked.includes(x.key));const done=list.filter(x=>state.checked.includes(x.key));const term=nameKey(shopQuery);const visible=open.filter(x=>nameKey(x.name).includes(term));const sections=[...new Set(visible.map(x=>x.category))];const weeklyFiltered=state.weekly.filter(x=>nameKey(x.name).includes(nameKey(weeklyQuery)));return `<section class="section"><div class="sectionTitle"><h2>Einkaufsliste</h2><span class="chip">${open.length} offen · ${done.length} erledigt</span></div><div class="switches"><button class="btn tiny ${shopTab==='list'?'':'outline'}" onclick="shopTab='list';draw()">Einkaufen</button><button class="btn tiny ${shopTab==='weekly'?'':'outline'}" onclick="shopTab='weekly';draw()">Wochenbedarf</button><button class="btn tiny ${shopTab==='templates'?'':'outline'}" onclick="shopTab='templates';draw()">Vorlage</button></div>${shopTab==='list'?`<div class="mutedbox" style="margin-top:12px">Zutaten aus den noch offenen Gerichten, Standardprodukte und Extras werden kombiniert. Änderungen an Mengen gelten nur für diese Woche.</div><div class="row" style="margin-top:12px"><input class="search grow" style="min-width:0" placeholder="Einkaufsartikel suchen …" value="${safe(shopQuery)}" oninput="shopQuery=this.value;refreshShopResults()"><button class="btn tiny secondary" onclick="openExtra()">＋ Extra</button></div><div id="shop-results">${shopListContent(visible,done,term)}</div><button class="btn ghost wide" onclick="resetChecks()">Einkaufshäkchen zurücksetzen</button><button class="btn ghost wide" onclick="resetShopAdjustments()">Wochenmengen zurücksetzen</button>`:shopTab==='weekly'?`<div class="mutedbox" style="margin-top:12px">Wähle aus eurer Standardvorlage aus, was ihr diese Woche braucht. Du kannst beliebige Mengen einstellen, ohne die Vorlage zu verändern.</div><input class="search" style="margin-top:12px" placeholder="Standardprodukt suchen …" value="${safe(weeklyQuery)}" oninput="weeklyQuery=this.value;refreshWeeklyResults()"><div id="weekly-results">${weeklyContent(weeklyFiltered)}</div><div class="row" style="margin-top:10px"><button class="btn tiny secondary grow" onclick="setAllWeekly(true)">Alle auswählen</button><button class="btn tiny outline grow" onclick="setAllWeekly(false)">Alle abwählen</button></div><button class="btn secondary wide" style="margin-top:10px" onclick="shopTab='templates';draw()">⚙ Standardvorlage anpassen</button><button class="btn ghost wide" onclick="resetWeekly()">Wochenbedarf aus Vorlage neu laden</button>`:`<div class="mutedbox" style="margin-top:12px"><strong>Dauerhafte Vorlage</strong><br>Hier änderst du die üblichen Produkte und Standardmengen für zukünftige Wochen. Änderungen an der aktuellen Einkaufsliste passieren separat.</div><div class="card">${state.templates.map(x=>`<div class="itemrow"><div class="grow"><strong>${safe(x.name)}</strong><div class="muted small">${safe(x.qty)} ${safe(x.unit)} · ${safe(x.category)}</div></div><button class="btn tiny outline" onclick="editTemplate('${x.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteTemplate('${x.id}')">×</button></div>`).join('')||'<p class="muted">Noch keine Standardprodukte.</p>'}</div><button class="btn wide" onclick="editTemplate()">＋ Standardprodukt aufnehmen</button><p class="notice">Änderungen an der Vorlage werden bei einem neuen Wochenbedarf übernommen; deine aktuelle Auswahl bleibt bestehen.</p>`}</section>`}
function shopListContent(open,done,term){const groups=[...new Set(open.map(x=>x.category))];return `${groups.map(c=>`<div class="card"><h3 style="margin:0 0 8px">${safe(c)}</h3>${shopEntries(open.filter(x=>x.category===c))}</div>`).join('')||'<div class="card empty">Keine offenen Artikel gefunden.</div>'}<div class="card"><div class="row between"><strong>Erledigt (${done.length})</strong><button class="btn tiny ghost" onclick="shopShowDone=!shopShowDone;draw()">${shopShowDone?'Ausblenden':'Anzeigen'}</button></div>${shopShowDone?shopEntries(done.filter(x=>nameKey(x.name).includes(term))):''}</div>`}
function refreshShopResults(){const list=totals();const term=nameKey(shopQuery);document.getElementById('shop-results').innerHTML=shopListContent(list.filter(x=>!state.checked.includes(x.key)&&nameKey(x.name).includes(term)),list.filter(x=>state.checked.includes(x.key)),term)}
function weeklyContent(rows){return `<div class="card">${rows.map(x=>`<div class="itemrow"><input class="tick" type="checkbox" ${x.enabled?'checked':''} onchange="setWeekly('${x.id}','enabled',this.checked)"><span class="grow">${safe(x.name)}</span><input aria-label="Menge ${safe(x.name)}" style="width:75px;text-align:center" type="number" min="0" step="any" value="${x.qty}" onchange="setWeekly('${x.id}','qty',this.value)"><span class="quantity" style="width:55px">${safe(x.unit)}</span></div>`).join('')||'<p class="muted">Keine passenden Standardprodukte.</p>'}</div>`}
function refreshWeeklyResults(){document.getElementById('weekly-results').innerHTML=weeklyContent(state.weekly.filter(x=>nameKey(x.name).includes(nameKey(weeklyQuery))))}
function setAllWeekly(v){ensureWeekly();state.weekly.forEach(x=>{if(nameKey(x.name).includes(nameKey(weeklyQuery)))x.enabled=v});save();draw()}
function adjustShopAmount(enc,delta){const key=decodeURIComponent(enc),x=totals().find(x=>x.key===key);if(!x)return;const next=Math.max(0,Math.round((x.qty+delta)*1000)/1000);state.shopOverrides[key]=next;save();draw()}
function fridgeNames(){return (Array.isArray(state.pantry)?state.pantry:[]).map(x=>typeof x==='string'?x:x?.name||'').filter(Boolean)}
function ingredientKey(s){let t=nameKey(String(s||'')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ').trim();const alias=[['tomate','tomaten','cherrytomaten'],['paprika','paprikaschoten'],['kartoffel','kartoffeln'],['zwiebel','zwiebeln'],['karotte','karotten','mohren','mohre'],['nudeln','nudel','pasta','spaghetti','penne','fusilli'],['reis','basmatireis','jasminreis'],['ei','eier'],['zucchini','zucchinis'],['käse','kase','geriebener kase']];for(const group of alias)if(group.includes(t))return group[0];return t}
function ingredientMatches(a,b){const x=ingredientKey(a),y=ingredientKey(b);return !!x&&!!y&&(x===y||(x.length>=5&&y.length>=5&&(x.includes(y)||y.includes(x))))}
function fridgeMatches(){const have=fridgeNames();return state.dishes.map(d=>{const all=(d.ingredients||[]).filter(i=>i.name?.trim());const present=all.filter(i=>have.some(h=>ingredientMatches(i.name,h)));const missing=all.filter(i=>!have.some(h=>ingredientMatches(i.name,h)));return {d,all,present,missing,ratio:all.length?present.length/all.length:0}}).filter(x=>x.present.length>0).sort((a,b)=>b.present.length-a.present.length||b.ratio-a.ratio||a.missing.length-b.missing.length||a.d.name.localeCompare(b.d.name,'de'))}
function addFridge(e){e.preventDefault();const input=document.getElementById('fridge-add');if(!input)return;const val=input.value.trim().replace(/\s+/g,' ');if(!val)return;if(!fridgeNames().some(n=>ingredientKey(n)===ingredientKey(val)))state.pantry.push(val);save();draw()}
function removeFridge(i){state.pantry.splice(i,1);save();draw()}
function clearFridge(){if(!confirm('Alle ausgewählten Kühlschrankzutaten entfernen?'))return;state.pantry=[];save();draw()}
function quickFridge(enc){const val=decodeURIComponent(enc);if(!fridgeNames().some(n=>ingredientKey(n)===ingredientKey(val))){state.pantry.push(val);save();draw()}}
function drawFridge(){const have=fridgeNames(),matches=fridgeMatches();const candidates=[...new Set(state.dishes.flatMap(d=>(d.ingredients||[]).map(i=>i.name.trim()).filter(Boolean)))].filter(n=>!have.some(h=>ingredientMatches(n,h))).sort((a,b)=>a.localeCompare(b,'de')).slice(0,35);return `<section class="section"><div class="sectionTitle"><h2>Was ist noch da?</h2><span class="chip">${have.length} Zutaten</span></div><div class="mutedbox">Trage ein, was ihr noch im Kühlschrank oder Vorrat habt. Die App schlägt auch Gerichte vor, für die <b>nicht alle Zutaten</b> vorhanden sind.</div><form class="row" style="margin-top:13px" onsubmit="addFridge(event)"><input id="fridge-add" class="search grow" list="fridge-suggest" placeholder="z. B. Zucchini, Reis, Eier" autocomplete="off" required><datalist id="fridge-suggest">${candidates.map(n=>`<option value="${safe(n)}">`).join('')}</datalist><button class="btn" type="submit">＋</button></form>${have.length?`<div class="filterchips" style="margin-top:12px">${have.map((n,i)=>`<button class="filterchip selected" onclick="removeFridge(${i})" title="Entfernen">${safe(n)} ×</button>`).join('')}</div><button class="btn tiny ghost" style="margin-top:10px" onclick="clearFridge()">Alle Zutaten entfernen</button>`:''}<div class="sectionTitle" style="margin-top:22px"><h2>Passende Gerichte</h2><span class="chip">${matches.length} Vorschläge</span></div>${!have.length?'<div class="card empty">Trage oben eine oder mehrere Zutaten ein. Dann erscheinen passende Gerichte aus eurer Sammlung.</div>':matches.length?matches.map(x=>`<article class="card"><div class="row between"><div class="grow"><div class="meal-title">${safe(x.d.emoji||'🍽️')} ${safe(x.d.name)}</div><div class="small muted">${x.present.length} von ${x.all.length} Zutaten vorhanden · ${x.d.minutes||'?'} Min.</div></div><span class="chip">${Math.round(x.ratio*100)} %</span></div><div class="bar"><div style="width:${x.ratio*100}%"></div></div><div class="small" style="margin-top:10px;color:#356b48"><b>Vorhanden:</b> ${x.present.map(i=>safe(i.name)).join(', ')}</div>${x.missing.length?`<div class="small" style="margin-top:6px;color:#8a6041"><b>Fehlt noch:</b> ${x.missing.map(i=>safe(i.name)).join(', ')}</div>`:'<div class="small" style="margin-top:6px;color:#356b48"><b>Alle Zutaten vorhanden!</b></div>'}<div class="actions"><button class="btn tiny" onclick="addFridgePlan('${x.d.id}')">＋ Einplanen</button><button class="btn tiny outline" onclick="openDish('${x.d.id}')">Gericht ansehen</button></div></article>`).join(''):'<div class="card empty">Noch keine Übereinstimmung. Probiere weitere Zutaten aus oder ergänze fehlende Zutaten in euren Gerichten.</div>'}<p class="notice">Die Vorschläge prüfen Zutaten-Namen, nicht Mengen. Ähnliche Bezeichnungen werden teilweise erkannt. Die Einkaufsliste für geplante Gerichte bleibt unabhängig und unverändert.</p></section>`}
function addFridgePlan(did){if(!dish(did))return;state.plan.push({id:id(),dishId:did,done:false});save();draw();alert('Gericht zum Wochenplan hinzugefügt.')}
function drawSettings(){return `<section class="section"><div class="card"><h2>Daten sichern</h2><p class="small muted">Aktuell werden alle Daten ausschließlich auf diesem Gerät und in diesem Browser gespeichert. Noch keine Familien-Synchronisierung.</p><button class="btn secondary" onclick="exportData()">⇩ Sicherung herunterladen</button><label>Eine bestehende Sicherung importieren</label><input type="file" accept="application/json,.json" onchange="importData(this)"></div><div class="card"><h2>App auf dem Home-Bildschirm</h2><p class="small muted">Nach dem Veröffentlichen über eine HTTPS-Adresse in Safari öffnen, dann <b>Teilen → Zum Home-Bildschirm</b> auswählen.</p></div><div class="card"><h2>Hinweis</h2><p class="small muted">Die mitgelieferten Gerichte und Standardprodukte sind Beispiele. Du kannst sie ändern oder löschen. Für eine zentrale Familien-Datenbank kommt später eine Synchronisierung hinzu.</p><button class="btn danger" onclick="resetAll()">Alle Daten zurücksetzen</button></div></section>`}
function showModal(body){modal=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><span class="eyebrow">Familienküche</span><button class="btn tiny ghost" onclick="closeModal()">✕ Schließen</button></div>${body}</div></div>`;draw()};function closeModal(){modal=null;draw()}
function pickerFiltered(){return state.dishes.filter(d=>matchesOptions(d,pickGroups,pickSeasons)&&(!pickFav||d.favorite)&&nameKey(d.name).includes(nameKey(pickSearch)))}
function openPicker(){const filtered=pickerFiltered();showModal(`<h2>Gerichte für die Woche</h2><p class="muted small">Mehrere Grundzutaten oder Saisons auswählen. Innerhalb einer Filterart reicht eine Übereinstimmung; zwischen Grundzutat und Saison gelten beide Filter.</p><input class="search" placeholder="Gericht suchen …" value="${safe(pickSearch)}" oninput="pickSearch=this.value;refreshPicker()">${multiFilters(pickGroups,pickSeasons,'picker')}<label style="display:flex;gap:9px;align-items:center"><input type="checkbox" style="width:auto" ${pickFav?'checked':''} onchange="pickFav=this.checked;refreshPicker()"> Nur Favoriten</label><div id="pick-results">${pickerItems(filtered)}</div><button class="btn secondary wide" style="margin-top:14px" onclick="closeModal();navigate('dishes')">Zur Gerichtesammlung</button>`)}
function pickerItems(items){return items.length?items.map(d=>`<div class="itemrow"><span class="grow"><strong>${safe(d.emoji||'🍽️')} ${safe(d.name)}</strong><div class="muted small">${dishGroups(d).map(safe).join(', ')}${(d.seasons||[]).length?' · '+d.seasons.map(safe).join(', '):''}</div></span><button class="btn tiny" onclick="addPlan('${d.id}')">＋ Planen</button></div>`).join(''):'<div class="empty">Keine passenden Gerichte. Ändere die Filter oder ergänze beim Gericht die Saison.</div>'}
function refreshPicker(){const el=document.getElementById('pick-results');if(el)el.innerHTML=pickerItems(pickerFiltered())}
function addPlan(d){state.plan.push({id:id(),dishId:d,done:false});save();openPicker()};function toggleCook(p){let x=state.plan.find(i=>i.id===p);if(!x)return;x.done=!x.done;if(x.done)state.history.push({dishId:x.dishId,date:new Date().toISOString()});save();draw()}function removePlan(p){state.plan=state.plan.filter(x=>x.id!==p);save();draw()}function newWeek(){if(!confirm('Neue Planung beginnen? Offene Gerichte bleiben erhalten, gekochte werden aus dem Plan entfernt. Die abgehakten Einkaufsartikel werden zurückgesetzt.'))return;state.plan=state.plan.filter(x=>!x.done);state.checked=[];state.weekly=state.templates.map(x=>({...clone(x),source:'standard',templateId:x.id,enabled:true}));state.manual=[];state.shopOverrides={};state.shopExcluded=[];save();draw()}
function openDish(did){const d=dish(did);if(!d)return;showModal(`<h2>${safe(d.emoji||'🍽️')} ${safe(d.name)}</h2><div class="row" style="flex-wrap:wrap"><span class="chip">${d.minutes||'?'} Minuten</span><span class="chip">${safe(d.category||'Gericht')}</span>${dishGroups(d).map(g=>`<span class="chip">${safe(g)}</span>`).join('')}${(d.seasons||[]).map(x=>`<span class="chip">${safe(x)}</span>`).join('')}${d.favorite?'<span class="chip">♥ Favorit</span>':''}</div><h3>Zutaten</h3>${d.ingredients.length?d.ingredients.map(x=>`<div class="itemrow"><span class="grow">${safe(x.name)}</span><span class="quantity">${safe(quantity(x))}</span></div>`).join(''):'<p class="muted small">Noch keine Zutaten hinterlegt.</p>'}<hr class="divider"><details><summary style="font-weight:700;padding:10px 0;cursor:pointer">Rezept / Zubereitung anzeigen</summary><p style="white-space:pre-wrap;line-height:1.5">${safe(d.recipe||'Für dieses Gericht ist noch kein Rezept hinterlegt.')}</p></details><div class="actions"><button class="btn" onclick="addPlan('${d.id}');closeModal()">＋ Zum Wochenplan</button><button class="btn outline" onclick="editDish('${d.id}')">Bearbeiten</button><button class="btn secondary" onclick="toggleFavorite('${d.id}')">${d.favorite?'♥ Favorit entfernen':'♡ Favorit'}</button></div>`)}function toggleFavorite(did){const d=dish(did);d.favorite=!d.favorite;save();openDish(did)}
let ingredientDraft=[];function editDish(did){const d=dish(did);ingredientDraft=clone(d?.ingredients||[]);showDishEditor(d)}function showDishEditor(d){showModal(`<h2>${d?'Gericht bearbeiten':'Neues Gericht'}</h2><form onsubmit="submitDish(event,'${d?.id||''}')"><label>Name *</label><input name="name" required value="${safe(d?.name||'')}"><div class="form-cols"><div><label>Symbol / Emoji</label><input name="emoji" maxlength="8" value="${safe(d?.emoji||'🍽️')}"></div><div><label>Kochzeit (Min.)</label><input name="minutes" type="number" min="0" value="${d?.minutes||30}"></div></div><label>Grundzutaten / Gerichtgruppen (Mehrfachauswahl)</label><div class="season-list">${baseGroups.map(x=>`<label class="season-item"><input type="checkbox" name="group" value="${x}" ${dishGroups(d||{name:'',ingredients:[]}).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><label>Saisonal passend (Mehrfachauswahl)</label><div class="season-list">${seasons.map(x=>`<label class="season-item"><input type="checkbox" name="season" value="${x}" ${(d?.seasons||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><label>Kategorie</label><select name="category">${['Hauptgericht','Frühstück','Snack','Sonstiges'].map(x=>`<option ${d?.category===x?'selected':''}>${x}</option>`).join('')}</select><label style="display:flex;align-items:center;gap:8px"><input style="width:auto" type="checkbox" name="favorite" ${d?.favorite?'checked':''}> Familienfavorit</label><h3>Zutaten</h3><div id="draftIngredients">${drawDraftIngredients()}</div><button type="button" class="btn secondary tiny" onclick="addDraftIngredient()">＋ Zutat hinzufügen</button><label>Zubereitung (optional)</label><textarea name="recipe" placeholder="Nur bei Bedarf ...">${safe(d?.recipe||'')}</textarea><div class="actions"><button class="btn" type="submit">Gericht speichern</button>${d?`<button type="button" class="btn danger" onclick="deleteDish('${d.id}')">Löschen</button>`:''}</div></form>`)}function drawDraftIngredients(){return ingredientDraft.map((x,i)=>`<div class="itemrow"><input aria-label="Zutat" placeholder="Zutat" style="flex:1;min-width:0" value="${safe(x.name)}" oninput="ingredientDraft[${i}].name=this.value"><input aria-label="Menge" type="number" min="0" step="any" style="width:67px" value="${x.qty}" oninput="ingredientDraft[${i}].qty=this.value"><select aria-label="Einheit" style="width:89px;padding:9px 4px" onchange="ingredientDraft[${i}].unit=this.value">${units.map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select><button type="button" class="btn tiny danger" onclick="removeDraftIngredient(${i})">×</button></div>`).join('')}function addDraftIngredient(){ingredientDraft.push({name:'',qty:1,unit:'Stück'});document.getElementById('draftIngredients').innerHTML=drawDraftIngredients()}function removeDraftIngredient(i){ingredientDraft.splice(i,1);document.getElementById('draftIngredients').innerHTML=drawDraftIngredients()}function submitDish(e,did){e.preventDefault();const f=e.target;const d={id:did||id(),name:f.elements.name.value.trim(),emoji:f.elements.emoji.value||'🍽️',minutes:Math.max(0,Number(f.elements.minutes.value)||0),category:f.elements.category.value,group:[...f.querySelectorAll('input[name=group]:checked')].map(x=>x.value)[0]||'Sonstiges',groups:[...f.querySelectorAll('input[name=group]:checked')].map(x=>x.value),seasons:[...f.querySelectorAll('input[name=season]:checked')].map(x=>x.value),favorite:f.elements.favorite.checked,ingredients:ingredientDraft.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(),qty:Math.max(0,Number(x.qty)||0),unit:x.unit})),recipe:f.elements.recipe.value};if(!d.name)return;const index=state.dishes.findIndex(x=>x.id===did);if(index<0)state.dishes.push(d);else state.dishes[index]=d;save();closeModal()}function deleteDish(did){if(!confirm('Gericht endgültig löschen? Es wird auch aus dem Wochenplan entfernt.'))return;state.dishes=state.dishes.filter(d=>d.id!==did);state.plan=state.plan.filter(p=>p.dishId!==did);save();closeModal()}
function editShopAmount(enc){const key=decodeURIComponent(enc),x=totals().find(x=>x.key===key);if(!x)return;const value=prompt('Menge für '+x.name+' in '+x.unit+' (nur diese Woche):',x.qty);if(value===null)return;const qty=Number(value.trim().replace(',','.'));if(!Number.isFinite(qty)||qty<0){alert('Bitte eine gültige positive Menge eingeben.');return}state.shopOverrides[key]=qty;save();draw()}
function excludeShopItem(enc){const key=decodeURIComponent(enc);if(!confirm('Diesen Artikel aus der aktuellen Einkaufsliste entfernen?'))return;state.shopExcluded.push(key);save();draw()}
function resetShopAdjustments(){if(!confirm('Alle individuellen Mengenänderungen und entfernten Artikel dieser Woche zurücksetzen?'))return;state.shopOverrides={};state.shopExcluded=[];save();draw()}
function toggleCheck(enc){const key=decodeURIComponent(enc);state.checked=state.checked.includes(key)?state.checked.filter(x=>x!==key):[...state.checked,key];save();refreshShopResults()}function resetChecks(){if(!confirm('Alle Häkchen der Einkaufsliste zurücksetzen?'))return;state.checked=[];save();draw()}function setWeekly(t,field,value){const x=state.weekly.find(y=>y.id===t);if(!x)return;x[field]=field==='qty'?Math.max(0,Number(value)||0):value;save();draw()}function resetWeekly(){if(!confirm('Den aktuellen Wochenbedarf aus der gespeicherten Vorlage neu laden?'))return;state.weekly=state.templates.map(x=>({...clone(x),source:'standard',templateId:x.id,enabled:true}));state.shopOverrides={};state.shopExcluded=[];save();draw()}
function editTemplate(tid){let t=state.templates.find(x=>x.id===tid);showModal(`<h2>${t?'Standardprodukt bearbeiten':'Standardprodukt hinzufügen'}</h2><form onsubmit="submitTemplate(event,'${tid||''}')"><label>Produktname *</label><input name="name" required value="${safe(t?.name||'')}"><div class="form-cols"><div><label>Standardmenge</label><input name="qty" type="number" min="0" step="any" required value="${t?.qty??1}"></div><div><label>Einheit</label><select name="unit">${units.map(u=>`<option ${t?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div><label>Supermarktbereich</label><select name="category">${categories.map(c=>`<option ${t?.category===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn wide" style="margin-top:18px" type="submit">Als Standard speichern</button></form>`)}function submitTemplate(e,tid){e.preventDefault();const f=e.target;const t={id:tid||id(),name:f.elements.name.value.trim(),qty:Number(f.elements.qty.value),unit:f.elements.unit.value,category:f.elements.category.value};if(!t.name)return;const idx=state.templates.findIndex(x=>x.id===tid);if(idx<0)state.templates.push(t);else state.templates[idx]=t;save();closeModal()}function deleteTemplate(tid){if(!confirm('Standardprodukt dauerhaft aus der Vorlage entfernen?'))return;state.templates=state.templates.filter(x=>x.id!==tid);save();draw()}
function openExtra(){showModal(`<h2>Einzelprodukt hinzufügen</h2><p class="muted small">Nur für diese Einkaufsliste, nicht für die Standardvorlage.</p><form onsubmit="submitExtra(event)"><label>Produktname</label><input name="name" required><div class="form-cols"><div><label>Menge</label><input name="qty" type="number" min="0" step="any" value="1" required></div><div><label>Einheit</label><select name="unit">${units.map(u=>`<option>${u}</option>`).join('')}</select></div></div><label>Supermarktbereich</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn wide" type="submit" style="margin-top:18px">Zur Einkaufsliste hinzufügen</button></form>`)}
function submitExtra(e){e.preventDefault();let f=e.target;state.manual.push({id:id(),name:f.elements.name.value.trim(),qty:Number(f.elements.qty.value),unit:f.elements.unit.value,category:f.elements.category.value});save();closeModal()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='familienkueche-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){const f=input.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.dishes)||!Array.isArray(data.plan)||!Array.isArray(data.templates))throw Error('Ungültige Sicherungsdatei');if(confirm('Alle aktuellen Daten mit dieser Sicherung ersetzen?')){state={...clone(demo),...data};save();draw()}}catch(e){alert('Import fehlgeschlagen: '+e.message)}};reader.readAsText(f)}function resetAll(){if(!confirm('Alle lokalen Änderungen löschen und Beispieldaten wiederherstellen?'))return;state=clone(demo);save();draw()}
// UI action methods are intentionally global for the standalone single-file demo.
window.addEventListener('error',e=>console.error('Familienküche:',e.message));draw();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
