/* Version 10: reduzierte, typografische Oberfläche */
:root{--ink:#222922;--forest:#344f3d;--forest-dark:#243e2e;--sage:#eaece7;--paper:#fbfaf7;--line:#e9e9e3;--sub:#7c8279}
body{background:var(--paper)}
.top{padding:calc(env(safe-area-inset-top) + 24px) 0 13px;border-bottom:1px solid var(--line)}
.top h1{font-size:29px;letter-spacing:-.95px;font-weight:690;margin:0}
.topline{justify-content:flex-start}
.brandmark,.hero{display:none!important}
.section{margin-top:26px}.sectionTitle h2{font-size:19px;font-weight:675;letter-spacing:-.45px}
.quick-actions{margin-top:22px;gap:10px}.quick-actions .btn{min-height:47px}
.card{box-shadow:none;border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px}
.meal-card{padding:16px}.meal-card .meal-badge{background:#f4f3ef;border-radius:12px;width:43px;height:43px;font-size:22px}
.meal-card .meal-title{font-weight:660}.meal-card .actions{border-color:#f1f0ec}
.btn{border-radius:11px;font-weight:630;background:var(--forest)}.btn.secondary{background:#f0f1ed;color:#3b5040}.btn.outline{border-color:#dce2da;color:#344f3d}
.btn.ghost{color:#465a4a}.chip{background:#f1f2ee;color:#556c58;font-weight:550}
.nav{background:#fffefcf5;box-shadow:none;border-top:1px solid var(--line)}.nav button.active{background:#eff1eb;color:#2d5039}
.dish{border-radius:15px}.dish .art{background:#edf0e9!important}.search,input,select,textarea{border-color:#e0e3dc}
.mutedbox{background:#f0f2ed}.filterbox{box-shadow:none}.modal{background:#fbfaf7}
.cook-action{background:#fff;color:#405448;border:1px solid #cdd6cf;font-weight:600;gap:7px;min-height:39px;white-space:nowrap}.cook-action:active{background:#edf3ed}.cook-circle{width:17px;height:17px;border:1.8px solid #819087;border-radius:50%;display:inline-block;flex-shrink:0}@media(max-width:410px){.meal-card .row.between{align-items:flex-start;flex-wrap:wrap}.meal-card .cook-action{margin-left:auto}}
/* Version 12: mobile-first Wochenplan; Aktionen stehen niemals neben dem Titel. */
.quick-actions{display:block;margin-top:22px}.quick-actions>.btn{width:100%;text-align:center;letter-spacing:.01em}
.meal-card{padding:16px 16px 12px;overflow:hidden}
.plan-main{display:flex;align-items:center;gap:12px;min-width:0}
.plan-main .meal-badge{width:44px;height:44px;flex:0 0 44px;border-radius:12px}
.plan-content{min-width:0;flex:1}
.plan-content .meal-title{overflow-wrap:anywhere;font-size:16px;line-height:1.35;margin:0;font-weight:660}
.plan-meta{margin-top:5px;line-height:1.4}
.plan-footer{margin-top:16px;padding-top:12px;border-top:1px solid #eeefeb;display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan-links{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.plan-links .btn{font-size:12px;min-height:36px;padding:8px 9px}
.meal-card .cook-action{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:39px;margin:0;padding:8px 11px;background:#fff;border:1px solid #bbc7bc;border-radius:10px;color:#344f3d;line-height:1.2;font-size:13px;font-weight:650;white-space:nowrap;gap:7px}
.meal-card .cook-action .cook-circle{display:block;height:17px;width:17px;border:1.7px solid #657b6b;border-radius:50%;background:transparent}
.meal-card .cook-action:active{background:#eef3ed}
@media(max-width:355px){.meal-card{padding:13px}.plan-footer{align-items:stretch;flex-direction:column}.meal-card .cook-action{align-self:stretch}.plan-links{justify-content:flex-start}}

/* Version 13: ruhigere Gerichte-Ansicht mit eigenen Fotos */
.favorite-filter{display:flex;align-items:center;gap:10px;margin-top:14px;color:#46564b;font-size:14px;font-weight:550}
.favorite-filter input{width:18px;height:18px;accent-color:#344f3d}
.dishes-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dishes-grid .dish{overflow:hidden;padding:0;border-radius:15px;cursor:pointer}
.dishes-grid .dish-art{width:100%;aspect-ratio:1.25/1;height:auto;display:grid;place-items:center;background:#f1f1ed!important;overflow:hidden;border-radius:0}
.dish-art img{width:100%;height:100%;object-fit:cover;display:block}
.photo-fallback{font-size:42px}
.dishes-grid .content{padding:12px}
.dishes-grid .content h3{font-size:15px;line-height:1.35;overflow-wrap:anywhere;margin:0 0 5px}
.dishes-grid .content p{font-size:12px;line-height:1.4;margin:0}
.fav-heart{color:#9b635f;font-size:13px}
.detail-photo{width:100%;aspect-ratio:1.6/1;background:#f1f1ed;border-radius:14px;display:grid;place-items:center;overflow:hidden;margin:13px 0}
.detail-photo img{height:100%;width:100%;object-fit:cover}
.photo-editor{display:flex;gap:13px;align-items:center;margin:8px 0 18px}
.photo-preview{width:106px;height:90px;flex:0 0 106px;border:1px solid #e2e4dd;border-radius:12px;overflow:hidden;background:#f2f3ed;display:grid;place-items:center;font-size:30px}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-editor>div:last-child{min-width:0;flex:1}
.photo-editor input{width:100%;font-size:12px}
.quick-actions>.btn{min-height:40px;padding:10px 16px;width:auto;font-size:13px}
@media(max-width:380px){.sectionTitle{flex-wrap:wrap;gap:10px}.dishes-grid{gap:9px}.dishes-grid .content{padding:10px}}

/* V14 – kompakte Seitenköpfe und dezente Einkauf-Navigation */
.section{margin-top:15px}
.sectionTitle{align-items:center;gap:9px;margin-bottom:14px}
.sectionTitle h2{min-width:0;font-size:20px;line-height:1.25}
.sectionTitle>.btn{flex:0 0 auto;white-space:nowrap;font-size:12px;min-height:37px;padding:8px 10px}
.shop-toolbar{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.shop-link{border:0;background:transparent;color:#587363;font-size:13px;font-weight:600;padding:9px 2px;min-height:40px}
@media(max-width:355px){.sectionTitle h2{font-size:18px}.sectionTitle>.btn{font-size:11px;padding:8px}}

/* V15 – einheitliche Abschnittstitel und Hauptaktionen */
.sectionTitle h2 .muted{font-size:inherit;font-weight:inherit;line-height:inherit}
.weekly-entry{display:flex;justify-content:flex-start;margin:0 0 13px}
.weekly-entry .btn{min-height:38px;font-size:13px}

/* V16: platzsparende Einkaufsartikel, ohne überlappende Steuerelemente */
.shop-entry{padding:10px 0;border-bottom:1px solid #edf0e9;min-width:0}
.shop-entry:last-child{border-bottom:0}
.shop-entry-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:9px;min-width:0}
.shop-entry .tick{width:21px;height:21px;margin:0}
.shop-entry-name{font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.shop-qty-controls{display:flex;align-items:center;gap:2px;white-space:nowrap;max-width:100%}
.shop-qty-controls button{border:0;background:transparent;color:#344f3d;display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:36px;padding:4px;font-size:21px;font-weight:400;border-radius:8px}
.shop-qty-controls .shop-qty-value{color:#28392c;font-weight:650;font-size:13px;min-width:45px;max-width:112px;padding:5px 3px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;text-align:center}
.shop-qty-controls button:active{background:#f0f2ed}
.shop-entry-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-left:33px;margin-top:2px;min-width:0}
.shop-sources{display:flex;gap:4px;flex-wrap:wrap;min-width:0;flex:1;align-items:center}
.shop-source{display:inline-block;font-size:11px;line-height:1.35;color:#79857b;background:#f4f5f1;padding:3px 6px;border-radius:6px;overflow-wrap:anywhere;max-width:100%}
.shop-remove{background:transparent;border:0;color:#79857b;padding:5px 2px 5px 8px;font-size:12px;min-height:30px;flex:0 0 auto}
.shop-bought .shop-entry-name{text-decoration:line-through}
@media(max-width:370px){.shop-entry-head{gap:6px;grid-template-columns:21px minmax(0,1fr) auto}.shop-qty-controls button{min-width:27px}.shop-qty-controls .shop-qty-value{min-width:37px;max-width:76px;font-size:12px}.shop-entry-foot{padding-left:27px}}

/* V17 – klare Navigation im Wochenbedarf */
.weekly-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px;justify-content:space-between}.weekly-nav .btn:last-child{margin-left:auto}.weekly-template-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.weekly-template-actions .btn{width:100%;white-space:normal;text-align:center}.weekly-save-row{margin-top:16px}
.weekly-nav .btn{white-space:normal;text-align:center;line-height:1.2}
@media(max-width:360px){.weekly-nav .btn{font-size:12px;padding:8px 9px}}

/* V19 – identische, pfeilfreie Unterseiten-Navigation über allen Einkaufsansichten */
.shop-subnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:1px 0 19px}
.shop-subtab{min-width:0;min-height:42px;padding:9px 5px;border:1px solid #e1e5df;border-radius:10px;background:#fff;color:#566459;font-size:13px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer}
.shop-subtab.active{background:#eaf0e9;border-color:#bfcdbf;color:#2d4935;font-weight:700}

</style></head><body><div id="app" class="app"></div><div id="modal-root"></div><script>
const KEY='familienkueche_v1';const baseGroups=['Reis','Nudeln','Kartoffeln','Hülsenfrüchte','Gemüse','Brot & Teig','Sonstiges'];const seasons=['Frühling','Sommer','Herbst','Winter'];const categories=['Obst & Gemüse','Kühlregal','Backwaren','Vorrat','Tiefkühl','Drogerie','Sonstiges'];const units=['Stück','g','kg','ml','l','Packung','Becher','Bund','Dose','Flasche'];
const demo={dishes:[{id:'d1',name:'Gemüselasagne',group:'Nudeln',seasons:[],emoji:'🍝',minutes:50,category:'Hauptgericht',favorite:true,ingredients:[{name:'Zucchini',qty:2,unit:'Stück'},{name:'Karotten',qty:3,unit:'Stück'},{name:'Passierte Tomaten',qty:500,unit:'g'},{name:'Lasagneplatten',qty:250,unit:'g'},{name:'Käse',qty:200,unit:'g'}],recipe:'Gemüse klein schneiden und anbraten. Mit Tomaten köcheln lassen. Mit Lasagneplatten schichten, Käse darübergeben und im Ofen backen.'},{id:'d2',name:'Kartoffelpuffer',group:'Kartoffeln',seasons:[],emoji:'🥔',minutes:35,category:'Hauptgericht',favorite:true,ingredients:[{name:'Kartoffeln',qty:1000,unit:'g'},{name:'Eier',qty:2,unit:'Stück'},{name:'Mehl',qty:60,unit:'g'}],recipe:'Kartoffeln reiben und ausdrücken. Mit Ei und Mehl vermischen. Portionsweise in wenig Öl knusprig ausbacken.'},{id:'d3',name:'Gemüsecurry',group:'Reis',seasons:[],emoji:'🍛',minutes:30,category:'Hauptgericht',favorite:false,ingredients:[{name:'Reis',qty:250,unit:'g'},{name:'Paprika',qty:2,unit:'Stück'},{name:'Zucchini',qty:1,unit:'Stück'},{name:'Kokosmilch',qty:400,unit:'ml'}],recipe:'Reis garen. Gemüse anbraten, Kokosmilch zugeben und abschmecken.'},{id:'d4',name:'Spaghetti mit Tomatensoße',group:'Nudeln',seasons:[],emoji:'🍅',minutes:20,category:'Hauptgericht',favorite:true,ingredients:[{name:'Spaghetti',qty:500,unit:'g'},{name:'Passierte Tomaten',qty:500,unit:'g'},{name:'Zwiebeln',qty:1,unit:'Stück'}],recipe:'Spaghetti kochen. Zwiebeln anschwitzen, Tomaten zugeben, abschmecken und mit den Nudeln servieren.'}],plan:[{id:'p1',dishId:'d1',done:false},{id:'p2',dishId:'d2',done:false},{id:'p3',dishId:'d3',done:false}],templates:[{id:'t1',name:'Milch',qty:2,unit:'l',category:'Kühlregal'},{id:'t2',name:'Haferflocken',qty:500,unit:'g',category:'Vorrat'},{id:'t3',name:'Bananen',qty:6,unit:'Stück',category:'Obst & Gemüse'},{id:'t4',name:'Eier',qty:10,unit:'Stück',category:'Kühlregal'},{id:'t5',name:'Brot',qty:1,unit:'Stück',category:'Backwaren'}],weekly:null,manual:[],checked:[],history:[],pantry:[],shopOverrides:{},shopExcluded:[],staples:['Salz','Pfeffer','Öl']};
const clone=x=>JSON.parse(JSON.stringify(x));let state;try{state=JSON.parse(localStorage.getItem(KEY))||clone(demo)}catch{state=clone(demo)};for(const k in demo)if(!(k in state))state[k]=clone(demo[k]);if(!Array.isArray(state.pantry))state.pantry=[];if(!Array.isArray(state.staples))state.staples=['Salz','Pfeffer','Öl'];if(!state.shopOverrides||typeof state.shopOverrides!=='object')state.shopOverrides={};if(!Array.isArray(state.shopExcluded))state.shopExcluded=[];let dishFavoritesOnly=false;let photoDraft='';let view='plan',modal=null,query='',filter='Alle',shopTab='list',shopQuery='',shopShowDone=false,weeklyQuery='',searchIngredients='',pickGroups=[],pickSeasons=[],dishGroupsFilter=[],dishSeasonsFilter=[],pickSearch='',pickFav=false;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Speichern fehlgeschlagen. Bitte freien Speicherplatz prüfen.')}};const dish=id=>state.dishes.find(d=>d.id===id);function dishGroup(d){if(d.group)return d.group;const text=nameKey(d.name+' '+(d.ingredients||[]).map(i=>i.name).join(' '));if(/reis|risotto/.test(text))return 'Reis';if(/nudel|spaghetti|lasagne|pasta|penne|fusilli/.test(text))return 'Nudeln';if(/kartoff/.test(text))return 'Kartoffeln';if(/linsen|bohnen|kichererbs/.test(text))return 'Hülsenfrüchte';if(/pizza|brot|wrap|pfannkuchen/.test(text))return 'Brot & Teig';return 'Gemüse'}const dishGroups=d=>Array.isArray(d.groups)&&d.groups.length?d.groups:[dishGroup(d)];const matchesOptions=(d,groups,ss)=> (!groups.length||groups.some(g=>dishGroups(d).includes(g)))&&(!ss.length||ss.some(v=>(d.seasons||[]).includes(v)));const multiFilters=(groups,ss,kind)=>`<div class="filterbox"><div class="small muted" style="margin:7px 0">Grundzutaten · mehrere wählbar</div><div class="filterchips">${baseGroups.map(x=>`<button type="button" class="filterchip ${groups.includes(x)?'selected':''}" onclick="toggleMulti('${kind}','group','${x}')">${groups.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><div class="small muted" style="margin:12px 0 7px">Saison · mehrere wählbar</div><div class="filterchips">${seasons.map(x=>`<button type="button" class="filterchip ${ss.includes(x)?'selected':''}" onclick="toggleMulti('${kind}','season','${x}')">${ss.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><button type="button" class="btn tiny ghost" style="margin-top:8px" onclick="clearMulti('${kind}')">Filter zurücksetzen</button></div>`;function toggleMulti(kind,type,value){const arr=kind==='picker'?(type==='group'?pickGroups:pickSeasons):(type==='group'?dishGroupsFilter:dishSeasonsFilter);if(arr.includes(value))arr.splice(arr.indexOf(value),1);else arr.push(value);if(kind==='picker')openPicker();else draw()}function clearMulti(kind){if(kind==='picker'){pickGroups=[];pickSeasons=[];openPicker()}else{dishGroupsFilter=[];dishSeasonsFilter=[];draw()}};const quantity=i=>`${i.qty} ${i.unit}`;const nameKey=s=>s.trim().toLocaleLowerCase('de').replace(/\s+/g,' ');const ico=(name)=>({plan:'▦',dishes:'♧',shop:'▤',fridge:'▣',settings:'⚙'}[name]);
function ensureWeekly(){if(state.weekly===null)state.weekly=state.templates.map(x=>({...clone(x),source:'standard',templateId:x.id,enabled:true}));}function totals(){const raw=[];state.plan.filter(p=>!p.done).forEach(p=>{const d=dish(p.dishId);if(d)d.ingredients.forEach(x=>raw.push({...x,source:d.name,category:guessCategory(x.name)}))});ensureWeekly();state.weekly.filter(x=>x.enabled).forEach(x=>raw.push({...x,source:'Standardprodukt'}));state.manual.forEach(x=>raw.push({...x,source:'Zusatz'}));const aggregated=[];for(const x of raw){let qty=Number(x.qty)||0,unit=x.unit;if(unit==='kg'){unit='g';qty*=1000}if(unit==='l'){unit='ml';qty*=1000}const key=nameKey(x.name)+'|'+unit;let existing=aggregated.find(y=>y.key===key);if(existing){existing.qty+=qty;existing.sources.push(x.source)}else aggregated.push({...x,key,qty,unit,sources:[x.source]})}return aggregated.filter(x=>!state.shopExcluded.includes(x.key)).map(x=>({...x,qty:state.shopOverrides[x.key]!==undefined?Math.max(0,Number(state.shopOverrides[x.key])||0):x.qty})).sort((a,b)=>categories.indexOf(a.category)-categories.indexOf(b.category)||a.name.localeCompare(b.name,'de')).map(x=>({...x,displayQty:x.unit==='g'&&x.qty>=1000?`${(x.qty/1000).toLocaleString('de-DE')} kg`:x.unit==='ml'&&x.qty>=1000?`${(x.qty/1000).toLocaleString('de-DE')} l`:quantity(x)}))}
function guessCategory(n){const s=nameKey(n);if(/milch|käse|joghurt|eier|quark|butter/.test(s))return 'Kühlregal';if(/tomat|paprika|zucchini|kartoff|banan|karott|zwiebel|apfel/.test(s))return 'Obst & Gemüse';if(/brot|brötchen/.test(s))return 'Backwaren';return 'Vorrat'}
function draw(){let sub={plan:'Flexibel planen · ohne feste Wochentage',dishes:'Eure Lieblingsgerichte an einem Ort',shop:'Automatisch und individuell zusammengestellt',fridge:'Ideen mit euren vorhandenen Zutaten',settings:'Daten & Einstellungen'};document.getElementById('app').innerHTML=`<header class="top"><div class="topline"><div><h1>${({plan:"Wochenplan",dishes:"Gerichte",shop:"Einkaufsliste",fridge:"Kühlschrank",settings:"Einstellungen"})[view]}</h1></div></div></header><main>${view==='plan'?drawPlan():view==='dishes'?drawDishes():view==='shop'?drawShop():view==='fridge'?drawFridge():drawSettings()}</main><nav class="nav">${[['plan','Wochenplan'],['dishes','Gerichte'],['shop','Einkauf'],['fridge','Kühlschrank'],['settings','Mehr']].map(([v,l])=>`<button class="${view===v?'active':''}" onclick="navigate('${v}')"><span class="navicon" aria-hidden="true">${ico(v)}</span>${l}</button>`).join('')}</nav>`;document.getElementById('modal-root').innerHTML=modal||'';}
function navigate(v){view=v;modal=null;query='';draw();window.scrollTo(0,0)}function drawPlan(){const active=state.plan.filter(x=>!x.done);return `<section class="section"><div class="sectionTitle"><h2>Geplante Gerichte <span class="muted">(${active.length})</span></h2><button class="btn tiny" onclick="openPicker()">＋ Gerichte planen</button></div>${active.length?active.map(p=>planCard(p)).join(''):'<div class="card empty">Noch keine Gerichte geplant. Wähle ein Gericht aus eurer Sammlung.</div>'}</section>`}
function planCard(p){const d=dish(p.dishId);if(!d)return '';return `<article class="card meal-card"><div class="plan-main"><div class="meal-badge" aria-hidden="true">${safe(d.emoji||'🍽️')}</div><div class="plan-content"><div class="meal-title">${safe(d.name)}</div><div class="muted small plan-meta">${d.minutes||'?'} Min. · ${d.ingredients.length} Zutaten</div></div></div><div class="plan-footer"><div class="plan-links"><button class="btn tiny outline" onclick="openDish('${d.id}')">Ansehen</button><button class="btn tiny ghost" onclick="removePlan('${p.id}')">Entfernen</button></div><button class="btn tiny cook-action" onclick="toggleCook('${p.id}')" aria-label="${safe(d.name)} als gekocht markieren"><span class="cook-circle" aria-hidden="true"></span><span>Gekocht</span></button></div></article>`}
function selectedDishes(){return state.dishes.filter(d=>(!dishFavoritesOnly||d.favorite)&&nameKey(d.name).includes(nameKey(query))&&matchesOptions(d,dishGroupsFilter,dishSeasonsFilter))}
function drawDishes(){const filtered=selectedDishes();return `<section class="section"><div class="sectionTitle"><h2>Katalog <span class="muted">(${filtered.length}/${state.dishes.length})</span></h2><button class="btn tiny" onclick="editDish()">＋ Neues Gericht</button></div><input class="search" placeholder="Gericht suchen …" value="${safe(query)}" oninput="query=this.value;refreshDishes()"><label class="favorite-filter"><input type="checkbox" ${dishFavoritesOnly?'checked':''} onchange="dishFavoritesOnly=this.checked;refreshDishes()"> <span>♥ Nur Favoriten anzeigen</span></label>${multiFilters(dishGroupsFilter,dishSeasonsFilter,'dishes')}<div id="dish-results">${dishTiles(filtered)}</div></section>`}
function dishPhoto(d){return d.photo?`<img src="${safe(d.photo)}" alt="Foto von ${safe(d.name)}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="photo-fallback" hidden>${safe(d.emoji||'🍽️')}</span>`:`<span class="photo-fallback">${safe(d.emoji||'🍽️')}</span>`}
function dishTiles(items){return items.length?`<div class="grid dishes-grid" style="margin-top:12px">${items.map(d=>`<div class="card dish" onclick="openDish('${d.id}')"><div class="art dish-art">${dishPhoto(d)}</div><div class="content"><h3>${safe(d.name)} ${d.favorite?'<span class="fav-heart">♥</span>':''}</h3><p>${d.minutes||'?'} Min. · ${dishGroups(d).map(safe).join(', ')}</p></div></div>`).join('')}</div>`:'<div class="card empty">Kein Gericht gefunden. Ändere die Filter.</div>'}
function refreshDishes(){document.getElementById('dish-results').innerHTML=dishTiles(selectedDishes())}
function shopEntries(items){return items.map(x=>{const enc=encodeURIComponent(x.key),sources=[...new Set(x.sources)];return `<div class="shop-entry ${state.checked.includes(x.key)?'shop-bought':''}"><div class="shop-entry-head"><input type="checkbox" class="tick" aria-label="${safe(x.name)} als eingekauft markieren" ${state.checked.includes(x.key)?'checked':''} onchange="toggleCheck('${enc}')"><strong class="shop-entry-name">${safe(x.name)}</strong><div class="shop-qty-controls"><button type="button" aria-label="${safe(x.name)} Menge verringern" onclick="adjustShopAmount('${enc}',-1)">−</button><button type="button" class="shop-qty-value" title="Menge direkt eingeben" aria-label="Menge für ${safe(x.name)} ändern: ${safe(x.displayQty)}" onclick="editShopAmount('${enc}')">${safe(x.displayQty)}</button><button type="button" aria-label="${safe(x.name)} Menge erhöhen" onclick="adjustShopAmount('${enc}',1)">+</button></div></div><div class="shop-entry-foot"><div class="shop-sources" aria-label="Benötigt für">${sources.map(source=>`<span class="shop-source">${safe(source)}</span>`).join('')}</div><button type="button" class="shop-remove" onclick="excludeShopItem('${enc}')" aria-label="${safe(x.name)} aus dieser Einkaufsliste entfernen">Entfernen</button></div></div>`}).join('')}

function drawShop(){ensureWeekly();const list=totals();const open=list.filter(x=>!state.checked.includes(x.key));const done=list.filter(x=>state.checked.includes(x.key));const term=nameKey(shopQuery);const visible=open.filter(x=>nameKey(x.name).includes(term));const sections=[...new Set(visible.map(x=>x.category))];const weeklyFiltered=state.weekly.filter(x=>nameKey(x.name).includes(nameKey(weeklyQuery)));return `<section class="section"><nav class="shop-subnav" aria-label="Einkaufsliste Bereiche">${[['list','Lebensmittel'],['weekly','Wochenbedarf'],['templates','Vorlage']].map(([tab,label])=>`<button type="button" class="shop-subtab ${shopTab===tab?'active':''}" ${shopTab===tab?'aria-current="page"':''} onclick="shopTab='${tab}';draw()">${label}</button>`).join('')}</nav><div class="sectionTitle"><h2>${shopTab==='list'?'Lebensmittel':shopTab==='weekly'?'Wochenbedarf':'Standardvorlage'}</h2>${shopTab==='list'?`<button class="btn tiny" onclick="openExtra()">＋ Hinzufügen</button>`:shopTab==='weekly'?`<button class="btn tiny" onclick="openWeeklyExtra()">＋ Hinzufügen</button>`:''}</div>${shopTab==='list'?`<div class="row" style="margin-top:12px"><input class="search grow" style="min-width:0" placeholder="Einkaufsartikel suchen …" value="${safe(shopQuery)}" oninput="shopQuery=this.value;refreshShopResults()"></div><div id="shop-results">${shopListContent(visible,done,term)}</div><button class="btn ghost wide" onclick="resetChecks()">Einkaufshäkchen zurücksetzen</button><button class="btn ghost wide" onclick="resetShopAdjustments()">Wochenmengen zurücksetzen</button>`:shopTab==='weekly'?`<input class="search" style="margin-top:12px" placeholder="Standardprodukt suchen …" value="${safe(weeklyQuery)}" oninput="weeklyQuery=this.value;refreshWeeklyResults()"><div id="weekly-results">${weeklyContent(weeklyFiltered)}</div><div class="row" style="margin-top:10px"><button class="btn tiny secondary grow" onclick="setAllWeekly(true)">Alle auswählen</button><button class="btn tiny outline grow" onclick="setAllWeekly(false)">Alle abwählen</button></div><div class="weekly-template-actions"><button class="btn tiny secondary" onclick="resetWeekly()">Vorlage laden</button><button class="btn tiny secondary" onclick="saveWeeklyAsTemplate()">Als Vorlage speichern</button></div>`:`<div class="mutedbox" style="margin-top:12px"><strong>Dauerhafte Vorlage</strong><br>Hier änderst du die üblichen Produkte und Standardmengen für zukünftige Wochen. Änderungen an der aktuellen Einkaufsliste passieren separat.</div><div class="card">${state.templates.map(x=>`<div class="itemrow"><div class="grow"><strong>${safe(x.name)}</strong><div class="muted small">${safe(x.qty)} ${safe(x.unit)} · ${safe(x.category)}</div></div><button class="btn tiny outline" onclick="editTemplate('${x.id}')">Bearbeiten</button><button class="btn tiny danger" onclick="deleteTemplate('${x.id}')">×</button></div>`).join('')||'<p class="muted">Noch keine Standardprodukte.</p>'}</div><button class="btn wide" onclick="editTemplate()">＋ Standardprodukt aufnehmen</button><p class="notice">Änderungen an der Vorlage werden bei einem neuen Wochenbedarf übernommen; deine aktuelle Auswahl bleibt bestehen.</p>`}</section>`}
function shopListContent(open,done,term){const groups=[...new Set(open.map(x=>x.category))];return `${groups.map(c=>`<div class="card"><h3 style="margin:0 0 8px">${safe(c)}</h3>${shopEntries(open.filter(x=>x.category===c))}</div>`).join('')||'<div class="card empty">Keine offenen Artikel gefunden.</div>'}<div class="card"><div class="row between"><strong>Erledigt (${done.length})</strong><button class="btn tiny ghost" onclick="shopShowDone=!shopShowDone;draw()">${shopShowDone?'Ausblenden':'Anzeigen'}</button></div>${shopShowDone?shopEntries(done.filter(x=>nameKey(x.name).includes(term))):''}</div>`}
function refreshShopResults(){const list=totals();const term=nameKey(shopQuery);document.getElementById('shop-results').innerHTML=shopListContent(list.filter(x=>!state.checked.includes(x.key)&&nameKey(x.name).includes(term)),list.filter(x=>state.checked.includes(x.key)),term)}
function weeklyContent(rows){return `<div class="card">${rows.map(x=>`<div class="itemrow"><input class="tick" type="checkbox" ${x.enabled?'checked':''} onchange="setWeekly('${x.id}','enabled',this.checked)"><span class="grow">${safe(x.name)}</span><input aria-label="Menge ${safe(x.name)}" style="width:75px;text-align:center" type="number" min="0" step="any" value="${x.qty}" onchange="setWeekly('${x.id}','qty',this.value)"><span class="quantity" style="width:55px">${safe(x.unit)}</span>${x.weeklyOnly?`<button type="button" class="btn tiny ghost" aria-label="${safe(x.name)} aus Wochenbedarf entfernen" onclick="removeWeeklyExtra('${x.id}')">×</button>`:''}</div>`).join('')||'<p class="muted">Keine passenden Standardprodukte.</p>'}</div>`}
function refreshWeeklyResults(){document.getElementById('weekly-results').innerHTML=weeklyContent(state.weekly.filter(x=>nameKey(x.name).includes(nameKey(weeklyQuery))))}
function setAllWeekly(v){ensureWeekly();state.weekly.forEach(x=>{if(nameKey(x.name).includes(nameKey(weeklyQuery)))x.enabled=v});save();draw()}
function adjustShopAmount(enc,delta){const key=decodeURIComponent(enc),x=totals().find(x=>x.key===key);if(!x)return;const next=Math.max(0,Math.round((x.qty+delta)*1000)/1000);state.shopOverrides[key]=next;save();draw()}
function fridgeNames(){return (Array.isArray(state.pantry)?state.pantry:[]).map(x=>typeof x==='string'?x:x?.name||'').filter(Boolean)}
function ingredientKey(s){let t=nameKey(String(s||'')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ').trim();const alias=[['tomate','tomaten','cherrytomaten'],['paprika','paprikaschoten'],['kartoffel','kartoffeln'],['zwiebel','zwiebeln'],['karotte','karotten','mohren','mohre'],['nudeln','nudel','pasta','spaghetti','penne','fusilli'],['reis','basmatireis','jasminreis'],['ei','eier'],['zucchini','zucchinis'],['käse','kase','geriebener kase']];for(const group of alias)if(group.includes(t))return group[0];return t}
function ingredientMatches(a,b){const x=ingredientKey(a),y=ingredientKey(b);return !!x&&!!y&&(x===y||(x.length>=5&&y.length>=5&&(x.includes(y)||y.includes(x))))}
function stapleNames(){return (Array.isArray(state.staples)?state.staples:[]).filter(x=>typeof x==='string'&&x.trim())}
function addStaple(e){e.preventDefault();const field=document.getElementById('staple-add');if(!field)return;const val=field.value.trim().replace(/\s+/g,' ');if(!val)return;if(!stapleNames().some(n=>ingredientMatches(n,val))){state.staples.push(val);save()}draw()}
function removeStaple(i){state.staples.splice(i,1);save();draw()}
function fridgeMatches(){const have=fridgeNames(),basics=stapleNames();return state.dishes.map(d=>{const all=(d.ingredients||[]).filter(i=>i.name?.trim());const basic=all.filter(i=>basics.some(h=>ingredientMatches(i.name,h)));const considered=all.filter(i=>!basics.some(h=>ingredientMatches(i.name,h)));const present=considered.filter(i=>have.some(h=>ingredientMatches(i.name,h)));const missing=considered.filter(i=>!have.some(h=>ingredientMatches(i.name,h)));return {d,all,basic,considered,present,missing,ratio:considered.length?present.length/considered.length:0}}).filter(x=>x.present.length>=1).sort((a,b)=>b.present.length-a.present.length||b.ratio-a.ratio||a.missing.length-b.missing.length||a.d.name.localeCompare(b.d.name,'de'))}
function addFridge(e){e.preventDefault();const input=document.getElementById('fridge-add');if(!input)return;const val=input.value.trim().replace(/\s+/g,' ');if(!val)return;if(!fridgeNames().some(n=>ingredientKey(n)===ingredientKey(val)))state.pantry.push(val);save();draw()}
function removeFridge(i){state.pantry.splice(i,1);save();draw()}
function clearFridge(){if(!confirm('Alle ausgewählten Kühlschrankzutaten entfernen?'))return;state.pantry=[];save();draw()}
function quickFridge(enc){const val=decodeURIComponent(enc);if(!fridgeNames().some(n=>ingredientKey(n)===ingredientKey(val))){state.pantry.push(val);save();draw()}}
function drawFridge(){const have=fridgeNames(),basics=stapleNames(),matches=fridgeMatches();const candidates=[...new Set(state.dishes.flatMap(d=>(d.ingredients||[]).map(i=>i.name.trim()).filter(Boolean)))].filter(n=>!have.some(h=>ingredientMatches(n,h))&&!basics.some(h=>ingredientMatches(n,h))).sort((a,b)=>a.localeCompare(b,'de')).slice(0,35);return `<section class="section"><div class="sectionTitle"><h2>Was ist noch da?</h2><span class="chip">${have.length} Zutaten</span></div><div class="mutedbox">Gib vorhandene Zutaten ein. Die App zeigt auch Gerichte, bei denen noch Zutaten fehlen. Deine dauerhaft vorhandenen Grundzutaten werden automatisch berücksichtigt.</div><form class="row" style="margin-top:13px" onsubmit="addFridge(event)"><input id="fridge-add" class="search grow" list="fridge-suggest" placeholder="z. B. Zucchini, Reis, Eier" autocomplete="off" required><datalist id="fridge-suggest">${candidates.map(n=>`<option value="${safe(n)}">`).join('')}</datalist><button class="btn" type="submit">＋</button></form>${have.length?`<div class="filterchips" style="margin-top:12px">${have.map((n,i)=>`<button class="filterchip selected" onclick="removeFridge(${i})" title="Entfernen">${safe(n)} ×</button>`).join('')}</div><button class="btn tiny ghost" style="margin-top:10px" onclick="clearFridge()">Alle eingegebenen Zutaten entfernen</button>`:''}<details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">🧂 Grundzutaten verwalten (${basics.length})</summary><p class="small muted">Diese Zutaten gelten immer als vorhanden. Du kannst sie ergänzen oder entfernen. Sie erhöhen den Übereinstimmungswert nicht künstlich.</p><div class="filterchips">${basics.map((n,i)=>`<button class="filterchip selected" onclick="removeStaple(${i})" title="Grundzutat entfernen">${safe(n)} ×</button>`).join('')}</div><form class="row" style="margin-top:12px" onsubmit="addStaple(event)"><input id="staple-add" class="search grow" placeholder="z. B. Zucker, Mehl, Essig" required><button class="btn" type="submit">＋</button></form></details><div class="sectionTitle" style="margin-top:22px"><h2>Passende Gerichte</h2><span class="chip">${matches.length} Vorschläge</span></div>${!have.length?'<div class="card empty">Trage oben eine oder mehrere Zutaten ein. Salz, Pfeffer und andere Grundzutaten allein reichen bewusst nicht für einen Vorschlag.</div>':matches.length?matches.map(x=>`<article class="card"><div class="row between"><div class="grow"><div class="meal-title">${safe(x.d.emoji||'🍽️')} ${safe(x.d.name)}</div><div class="small muted">${x.present.length} von ${x.considered.length} weiteren Zutaten vorhanden · ${x.d.minutes||'?'} Min.</div></div><span class="chip">${Math.round(x.ratio*100)} %</span></div><div class="bar"><div style="width:${x.ratio*100}%"></div></div><div class="small" style="margin-top:10px;color:#356b48"><b>Vorhanden:</b> ${x.present.map(i=>safe(i.name)).join(', ')}</div>${x.basic.length?`<div class="small muted" style="margin-top:6px"><b>Grundzutaten:</b> ${x.basic.map(i=>safe(i.name)).join(', ')}</div>`:''}${x.missing.length?`<div class="small" style="margin-top:6px;color:#8a6041"><b>Fehlt noch:</b> ${x.missing.map(i=>safe(i.name)).join(', ')}</div>`:'<div class="small" style="margin-top:6px;color:#356b48"><b>Alle Zutaten vorhanden!</b></div>'}<div class="actions"><button class="btn tiny" onclick="addFridgePlan('${x.d.id}')">＋ Einplanen</button><button class="btn tiny outline" onclick="openDish('${x.d.id}')">Gericht ansehen</button></div></article>`).join(''):'<div class="card empty">Noch keine Übereinstimmung. Probiere weitere Zutaten aus oder ergänze fehlende Zutaten in euren Gerichten.</div>'}<p class="notice">Sortierung: zuerst die meisten vorhandenen Zutaten, bei Gleichstand die höchste Übereinstimmung. Nur Gerichte mit mindestens einer passenden Kühlschrankzutat erscheinen. Grundzutaten zählen nicht als Treffer. Mengen werden noch nicht verglichen. Die Einkaufsliste bleibt unverändert.</p></section>`}
function addFridgePlan(did){if(!dish(did))return;state.plan.push({id:id(),dishId:did,done:false});save();draw();alert('Gericht zum Wochenplan hinzugefügt.')}
function drawSettings(){return `<section class="section"><div class="card"><h2>Daten sichern</h2><p class="small muted">Aktuell werden alle Daten ausschließlich auf diesem Gerät und in diesem Browser gespeichert. Noch keine Familien-Synchronisierung.</p><button class="btn secondary" onclick="exportData()">⇩ Sicherung herunterladen</button><label>Eine bestehende Sicherung importieren</label><input type="file" accept="application/json,.json" onchange="importData(this)"></div><div class="card"><h2>App auf dem Home-Bildschirm</h2><p class="small muted">Nach dem Veröffentlichen über eine HTTPS-Adresse in Safari öffnen, dann <b>Teilen → Zum Home-Bildschirm</b> auswählen.</p></div><div class="card"><h2>Hinweis</h2><p class="small muted">Die mitgelieferten Gerichte und Standardprodukte sind Beispiele. Du kannst sie ändern oder löschen. Für eine zentrale Familien-Datenbank kommt später eine Synchronisierung hinzu.</p><button class="btn danger" onclick="resetAll()">Alle Daten zurücksetzen</button></div></section>`}
function showModal(body){modal=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><span class="eyebrow">Familienküche</span><button class="btn tiny ghost" onclick="closeModal()">✕ Schließen</button></div>${body}</div></div>`;draw()};function closeModal(){modal=null;draw()}
function pickerFiltered(){return state.dishes.filter(d=>matchesOptions(d,pickGroups,pickSeasons)&&(!pickFav||d.favorite)&&nameKey(d.name).includes(nameKey(pickSearch)))}
function openPicker(){const filtered=pickerFiltered();showModal(`<h2>Gerichte für die Woche</h2><p class="muted small">Mehrere Grundzutaten oder Saisons auswählen. Innerhalb einer Filterart reicht eine Übereinstimmung; zwischen Grundzutat und Saison gelten beide Filter.</p><input class="search" placeholder="Gericht suchen …" value="${safe(pickSearch)}" oninput="pickSearch=this.value;refreshPicker()">${multiFilters(pickGroups,pickSeasons,'picker')}<label style="display:flex;gap:9px;align-items:center"><input type="checkbox" style="width:auto" ${pickFav?'checked':''} onchange="pickFav=this.checked;refreshPicker()"> Nur Favoriten</label><div id="pick-results">${pickerItems(filtered)}</div><button class="btn secondary wide" style="margin-top:14px" onclick="closeModal();navigate('dishes')">Zur Gerichtesammlung</button>`)}
function pickerItems(items){return items.length?items.map(d=>`<div class="itemrow"><span class="grow"><strong>${safe(d.emoji||'🍽️')} ${safe(d.name)}</strong><div class="muted small">${dishGroups(d).map(safe).join(', ')}${(d.seasons||[]).length?' · '+d.seasons.map(safe).join(', '):''}</div></span><button class="btn tiny" onclick="addPlan('${d.id}')">＋ Planen</button></div>`).join(''):'<div class="empty">Keine passenden Gerichte. Ändere die Filter oder ergänze beim Gericht die Saison.</div>'}
function refreshPicker(){const el=document.getElementById('pick-results');if(el)el.innerHTML=pickerItems(pickerFiltered())}
function addPlan(d){state.plan.push({id:id(),dishId:d,done:false});save();openPicker()};function toggleCook(p){const x=state.plan.find(i=>i.id===p);if(!x)return;state.history.push({dishId:x.dishId,date:new Date().toISOString()});state.plan=state.plan.filter(i=>i.id!==p);save();draw()}function removePlan(p){state.plan=state.plan.filter(x=>x.id!==p);save();draw()}
function openDish(did){const d=dish(did);if(!d)return;showModal(`<h2>${safe(d.name)}</h2><div class="detail-photo">${dishPhoto(d)}</div><div class="row" style="flex-wrap:wrap"><span class="chip">${d.minutes||'?'} Minuten</span>${dishGroups(d).map(g=>`<span class="chip">${safe(g)}</span>`).join('')}${(d.seasons||[]).map(x=>`<span class="chip">${safe(x)}</span>`).join('')}${d.favorite?'<span class="chip">♥ Favorit</span>':''}</div><h3>Zutaten</h3>${d.ingredients.length?d.ingredients.map(x=>`<div class="itemrow"><span class="grow">${safe(x.name)}</span><span class="quantity">${safe(quantity(x))}</span></div>`).join(''):'<p class="muted small">Noch keine Zutaten hinterlegt.</p>'}<hr class="divider"><details><summary style="font-weight:700;padding:10px 0;cursor:pointer">Rezept / Zubereitung anzeigen</summary><p style="white-space:pre-wrap;line-height:1.5">${safe(d.recipe||'Für dieses Gericht ist noch kein Rezept hinterlegt.')}</p></details><div class="actions"><button class="btn" onclick="addPlan('${d.id}');closeModal()">＋ Zum Wochenplan</button><button class="btn outline" onclick="editDish('${d.id}')">Bearbeiten</button><button class="btn secondary" onclick="toggleFavorite('${d.id}')">${d.favorite?'♥ Favorit entfernen':'♡ Favorit'}</button></div>`)}function toggleFavorite(did){const d=dish(did);d.favorite=!d.favorite;save();openDish(did)}
let ingredientDraft=[];function editDish(did){const d=dish(did);photoDraft=d?.photo||'';ingredientDraft=clone(d?.ingredients||[]);showDishEditor(d)}function showDishEditor(d){showModal(`<h2>${d?'Gericht bearbeiten':'Neues Gericht'}</h2><form onsubmit="submitDish(event,'${d?.id||''}')"><label>Name *</label><input name="name" required value="${safe(d?.name||'')}"><div class="form-cols"><div><label>Symbol / Emoji</label><input name="emoji" maxlength="8" value="${safe(d?.emoji||'🍽️')}"></div><div><label>Kochzeit (Min.)</label><input name="minutes" type="number" min="0" value="${d?.minutes||30}"></div></div><label>Foto des Gerichts (optional)</label><div class="photo-editor"><div class="photo-preview" id="dishPhotoPreview">${photoDraft?`<img src="${safe(photoDraft)}" alt="Gerichtsfoto">`:'<span>📷</span>'}</div><div><input type="file" accept="image/*" onchange="setDishPhoto(this)" aria-label="Gerichtsfoto auswählen"><button type="button" class="btn tiny ghost" onclick="photoDraft='';document.getElementById('dishPhotoPreview').innerHTML='<span>📷</span>'">Foto entfernen</button><p class="muted small">Eigenes Foto vom iPhone auswählen. Es wird verkleinert und lokal gespeichert.</p></div></div><label>Grundzutaten / Gerichtgruppen (Mehrfachauswahl)</label><div class="season-list">${baseGroups.map(x=>`<label class="season-item"><input type="checkbox" name="group" value="${x}" ${dishGroups(d||{name:'',ingredients:[]}).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><label>Saisonal passend (Mehrfachauswahl)</label><div class="season-list">${seasons.map(x=>`<label class="season-item"><input type="checkbox" name="season" value="${x}" ${(d?.seasons||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><label style="display:flex;align-items:center;gap:8px"><input style="width:auto" type="checkbox" name="favorite" ${d?.favorite?'checked':''}> Familienfavorit</label><h3>Zutaten</h3><div id="draftIngredients">${drawDraftIngredients()}</div><button type="button" class="btn secondary tiny" onclick="addDraftIngredient()">＋ Zutat hinzufügen</button><label>Zubereitung (optional)</label><textarea name="recipe" placeholder="Nur bei Bedarf ...">${safe(d?.recipe||'')}</textarea><div class="actions"><button class="btn" type="submit">Gericht speichern</button>${d?`<button type="button" class="btn danger" onclick="deleteDish('${d.id}')">Löschen</button>`:''}</div></form>`)}function drawDraftIngredients(){return ingredientDraft.map((x,i)=>`<div class="itemrow"><input aria-label="Zutat" placeholder="Zutat" style="flex:1;min-width:0" value="${safe(x.name)}" oninput="ingredientDraft[${i}].name=this.value"><input aria-label="Menge" type="number" min="0" step="any" style="width:67px" value="${x.qty}" oninput="ingredientDraft[${i}].qty=this.value"><select aria-label="Einheit" style="width:89px;padding:9px 4px" onchange="ingredientDraft[${i}].unit=this.value">${units.map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select><button type="button" class="btn tiny danger" onclick="removeDraftIngredient(${i})">×</button></div>`).join('')}function addDraftIngredient(){ingredientDraft.push({name:'',qty:1,unit:'Stück'});document.getElementById('draftIngredients').innerHTML=drawDraftIngredients()}function removeDraftIngredient(i){ingredientDraft.splice(i,1);document.getElementById('draftIngredients').innerHTML=drawDraftIngredients()}function setDishPhoto(el){const file=el.files&&el.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,900/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photoDraft=canvas.toDataURL('image/jpeg',0.72);document.getElementById('dishPhotoPreview').innerHTML='<img alt="Ausgewähltes Foto" src="'+photoDraft+'">'};img.src=reader.result};reader.readAsDataURL(file)}
function submitDish(e,did){e.preventDefault();const f=e.target;const d={id:did||id(),name:f.elements.name.value.trim(),emoji:f.elements.emoji.value||'🍽️',minutes:Math.max(0,Number(f.elements.minutes.value)||0),photo:photoDraft,group:[...f.querySelectorAll('input[name=group]:checked')].map(x=>x.value)[0]||'Sonstiges',groups:[...f.querySelectorAll('input[name=group]:checked')].map(x=>x.value),seasons:[...f.querySelectorAll('input[name=season]:checked')].map(x=>x.value),favorite:f.elements.favorite.checked,ingredients:ingredientDraft.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(),qty:Math.max(0,Number(x.qty)||0),unit:x.unit})),recipe:f.elements.recipe.value};if(!d.name)return;const index=state.dishes.findIndex(x=>x.id===did);if(index<0)state.dishes.push(d);else state.dishes[index]=d;save();closeModal()}function deleteDish(did){if(!confirm('Gericht endgültig löschen? Es wird auch aus dem Wochenplan entfernt.'))return;state.dishes=state.dishes.filter(d=>d.id!==did);state.plan=state.plan.filter(p=>p.dishId!==did);save();closeModal()}
function editShopAmount(enc){const key=decodeURIComponent(enc),x=totals().find(x=>x.key===key);if(!x)return;const value=prompt('Menge für '+x.name+' in '+x.unit+' (nur diese Woche):',x.qty);if(value===null)return;const qty=Number(value.trim().replace(',','.'));if(!Number.isFinite(qty)||qty<0){alert('Bitte eine gültige positive Menge eingeben.');return}state.shopOverrides[key]=qty;save();draw()}
function excludeShopItem(enc){const key=decodeURIComponent(enc);if(!confirm('Diesen Artikel aus der aktuellen Einkaufsliste entfernen?'))return;state.shopExcluded.push(key);save();draw()}
function resetShopAdjustments(){if(!confirm('Alle individuellen Mengenänderungen und entfernten Artikel dieser Woche zurücksetzen?'))return;state.shopOverrides={};state.shopExcluded=[];save();draw()}
function toggleCheck(enc){const key=decodeURIComponent(enc);state.checked=state.checked.includes(key)?state.checked.filter(x=>x!==key):[...state.checked,key];save();refreshShopResults()}function resetChecks(){if(!confirm('Alle Häkchen der Einkaufsliste zurücksetzen?'))return;state.checked=[];save();draw()}function setWeekly(t,field,value){const x=state.weekly.find(y=>y.id===t);if(!x)return;x[field]=field==='qty'?Math.max(0,Number(value)||0):value;save();draw()}function resetWeekly(){if(!confirm('Den aktuellen Wochenbedarf aus der gespeicherten Vorlage neu laden?'))return;state.weekly=state.templates.map(x=>({...clone(x),source:'standard',templateId:x.id,enabled:true}));state.shopOverrides={};state.shopExcluded=[];save();draw()}
function saveWeeklyAsTemplate(){ensureWeekly();const chosen=state.weekly.filter(x=>x.enabled);if(!confirm(`Standardvorlage durch ${chosen.length} ausgewählte Produkte aus dem aktuellen Wochenbedarf ersetzen? Die bisherige Vorlage wird überschrieben.`))return;state.templates=chosen.map(x=>({id:x.templateId||id(),name:x.name,qty:Math.max(0,Number(x.qty)||0),unit:x.unit,category:x.category}));save();draw();alert('Standardvorlage gespeichert. Dein aktueller Wochenbedarf bleibt unverändert.');}
function openWeeklyExtra(){showModal(`<h2>Zum Wochenbedarf hinzufügen</h2><p class="muted small">Dieses Produkt gilt nur für den aktuellen Wochenbedarf und verändert die Standardvorlage nicht.</p><form onsubmit="submitWeeklyExtra(event)"><label>Produktname *</label><input name="name" required maxlength="120"><div class="form-cols"><div><label>Menge</label><input name="qty" type="number" min="0" step="any" value="1" required></div><div><label>Einheit</label><select name="unit">${units.map(u=>`<option>${u}</option>`).join('')}</select></div></div><label>Supermarktbereich</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn wide" type="submit" style="margin-top:18px">Zum Wochenbedarf hinzufügen</button></form>`)}
function submitWeeklyExtra(e){e.preventDefault();ensureWeekly();const f=e.target;const name=f.elements.name.value.trim();const qty=Number(f.elements.qty.value);if(!name||!Number.isFinite(qty)||qty<0)return;state.weekly.push({id:id(),name,qty,unit:f.elements.unit.value,category:f.elements.category.value,source:'standard',enabled:true,weeklyOnly:true});save();closeModal();shopTab='weekly';draw()}
function removeWeeklyExtra(tid){ensureWeekly();const x=state.weekly.find(t=>t.id===tid);if(!x||!x.weeklyOnly)return;if(!confirm(x.name+' aus dem aktuellen Wochenbedarf entfernen?'))return;state.weekly=state.weekly.filter(t=>t.id!==tid);save();draw()}
function editTemplate(tid){let t=state.templates.find(x=>x.id===tid);showModal(`<h2>${t?'Standardprodukt bearbeiten':'Standardprodukt hinzufügen'}</h2><form onsubmit="submitTemplate(event,'${tid||''}')"><label>Produktname *</label><input name="name" required value="${safe(t?.name||'')}"><div class="form-cols"><div><label>Standardmenge</label><input name="qty" type="number" min="0" step="any" required value="${t?.qty??1}"></div><div><label>Einheit</label><select name="unit">${units.map(u=>`<option ${t?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div><label>Supermarktbereich</label><select name="category">${categories.map(c=>`<option ${t?.category===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn wide" style="margin-top:18px" type="submit">Als Standard speichern</button></form>`)}function submitTemplate(e,tid){e.preventDefault();const f=e.target;const t={id:tid||id(),name:f.elements.name.value.trim(),qty:Number(f.elements.qty.value),unit:f.elements.unit.value,category:f.elements.category.value};if(!t.name)return;const idx=state.templates.findIndex(x=>x.id===tid);if(idx<0)state.templates.push(t);else state.templates[idx]=t;save();closeModal()}function deleteTemplate(tid){if(!confirm('Standardprodukt dauerhaft aus der Vorlage entfernen?'))return;state.templates=state.templates.filter(x=>x.id!==tid);save();draw()}
function openExtra(){showModal(`<h2>Einzelprodukt hinzufügen</h2><p class="muted small">Nur für diese Einkaufsliste, nicht für die Standardvorlage.</p><form onsubmit="submitExtra(event)"><label>Produktname</label><input name="name" required><div class="form-cols"><div><label>Menge</label><input name="qty" type="number" min="0" step="any" value="1" required></div><div><label>Einheit</label><select name="unit">${units.map(u=>`<option>${u}</option>`).join('')}</select></div></div><label>Supermarktbereich</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn wide" type="submit" style="margin-top:18px">Zur Einkaufsliste hinzufügen</button></form>`)}
function submitExtra(e){e.preventDefault();let f=e.target;state.manual.push({id:id(),name:f.elements.name.value.trim(),qty:Number(f.elements.qty.value),unit:f.elements.unit.value,category:f.elements.category.value});save();closeModal()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='familienkueche-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){const f=input.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.dishes)||!Array.isArray(data.plan)||!Array.isArray(data.templates))throw Error('Ungültige Sicherungsdatei');if(confirm('Alle aktuellen Daten mit dieser Sicherung ersetzen?')){state={...clone(demo),...data};save();draw()}}catch(e){alert('Import fehlgeschlagen: '+e.message)}};reader.readAsText(f)}function resetAll(){if(!confirm('Alle lokalen Änderungen löschen und Beispieldaten wiederherstellen?'))return;state=clone(demo);save();draw()}
// UI action methods are intentionally global for the standalone single-file demo.
window.addEventListener('error',e=>console.error('Familienküche:',e.message));draw();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
